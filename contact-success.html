<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent Successfully - MVP 3D Prints</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta http-equiv="refresh" content="5;url=index.html">
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg); padding: 2rem;">
        <div style="text-align: center; padding: 3rem; background: var(--bg2); border-radius: 20px; box-shadow: var(--card-shadow); max-width: 500px;">
            <i class="fas fa-check-circle" style="font-size: 5rem; color: var(--main-color); margin-bottom: 2rem; display: block;"></i>
            <h1 style="color: var(--light-text); margin-bottom: 1rem; font-size: 2.5rem;">Message Sent!</h1>
            <p style="color: var(--light-text); opacity: 0.8; font-size: 1.3rem; margin-bottom: 2rem;">Thank you for contacting MVP Prints. We'll get back to you within 24 hours.</p>
            <a href="index.html" style="background: linear-gradient(to right, var(--main-color), var(--accent-color)); color: white; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: 600; display: inline-block;">
                <i class="fas fa-home" style="margin-right: 0.5rem;"></i>
                Return Home
            </a>
            <p style="color: var(--light-text); opacity: 0.6; font-size: 0.9rem; margin-top: 2rem;">Redirecting automatically in 5 seconds...</p>
        </div>
    </div>
</body>
</html>
